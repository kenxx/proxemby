name: Changesets

on:
  push:
    branches:
      - main

concurrency:
  group: changesets-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  changesets:
    name: Release pull request or tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # With pending changesets, open or update the release pull request.
      - name: Release pull request
        id: changesets
        uses: changesets/action@v2.1.2
        with:
          version-script: npm run version
          commit-message: "chore: release"
          pr-title: "chore: release"

      # Without pending changesets (the release pull request was merged),
      # tag the version in package.json if it is not tagged yet.
      - name: Tag release
        id: tag
        if: steps.changesets.outputs.has-changesets == 'false'
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "$tag already exists"
            exit 0
          fi
          git tag "$tag"
          git push origin "refs/tags/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # Tags pushed with GITHUB_TOKEN do not trigger other workflows, so the
  # release workflows are called directly.
  release:
    name: Release
    needs: changesets
    if: needs.changesets.outputs.tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.changesets.outputs.tag }}

  docker:
    name: Docker
    needs: changesets
    if: needs.changesets.outputs.tag != ''
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    with:
      tag: ${{ needs.changesets.outputs.tag }}
