name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux-amd64:
    name: Build linux/amd64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Test
        run: cargo test --locked

      - name: Set version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ -z "$version" ]; then
            echo "version is empty" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build binary
        run: |
          cargo build --release --locked --target x86_64-unknown-linux-musl
          mkdir -p dist/proxemby-linux-amd64
          cp target/x86_64-unknown-linux-musl/release/proxemby dist/proxemby-linux-amd64/
          cp README.md dist/proxemby-linux-amd64/
          tar -C dist -czf dist/proxemby-linux-amd64.tar.gz proxemby-linux-amd64

      - name: Build Debian package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/package-deb.sh "$VERSION"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          name: proxemby ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## proxemby ${{ github.ref_name }}

            ## Changes
          files: |
            dist/proxemby-linux-amd64.tar.gz
            dist/proxemby_${{ steps.version.outputs.version }}_amd64.deb
