name: Release

on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      tag:
        description: Release tag, for example v1.2.3.
        required: true
        type: string

permissions:
  contents: write

jobs:
  linux-amd64:
    name: Build linux/amd64
    runs-on: ubuntu-latest

    env:
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Test
        run: cargo test --locked

      - name: Set version
        id: version
        run: |
          version="${TAG#v}"
          if [ -z "$version" ]; then
            echo "version is empty" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build binary
        run: |
          cargo build --release --locked --target x86_64-unknown-linux-musl
          mkdir -p dist/proxemby-linux-amd64
          cp target/x86_64-unknown-linux-musl/release/proxemby dist/proxemby-linux-amd64/
          cp README.md dist/proxemby-linux-amd64/
          tar -C dist -czf dist/proxemby-linux-amd64.tar.gz proxemby-linux-amd64

      - name: Build Debian package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/package-deb.sh "$VERSION"

      - name: Release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "## proxemby $TAG"
            echo
            if [ -f CHANGELOG.md ]; then
              awk -v v="$VERSION" '$0 == "## " v {found=1; next} found && /^## / {exit} found' CHANGELOG.md
            fi
          } > dist/release-notes.md

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: proxemby ${{ env.TAG }}
          body_path: dist/release-notes.md
          generate_release_notes: true
          files: |
            dist/proxemby-linux-amd64.tar.gz
            dist/proxemby_${{ steps.version.outputs.version }}_amd64.deb
